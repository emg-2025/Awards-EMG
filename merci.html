<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour votre vote !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(120% 140% at 50% -20%, #4B2E7A 0%, #2E1A52 65%, #1c0f38 100%);
    color:#FBF6E9; font-family:'Quicksand', sans-serif; text-align:center; padding:24px;
  }
  .card{max-width:420px;}
  h1{font-family:'Fraunces', serif; font-size:2rem; margin-bottom:12px;}
  p{color:#E7DCF5; margin-bottom:28px;}
  a.btn{
    display:inline-block; background:#D9A93B; color:#2E1A52; font-weight:700;
    padding:14px 26px; border-radius:12px; text-decoration:none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Merci pour votre vote ! 👑</h1>
    <p>Votre paiement a été confirmé et vos votes ont été ajoutés au compteur de votre nominé favori.</p>
    <a class="btn" href="/">Retour au vote</a>
  </div>
</body>
</html>
